<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueLib Catalogue</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>BlueLib Catalogue</h1>
    <nav>
      <input type="text" id="searchBox" placeholder="Search by title...">
      <select id="categoryFilter">
        <option value="all">All Categories</option>
        <option value="IT">IT</option>
        <option value="Business">Business</option>
        <option value="Science">Science</option>
        <option value="Arts">Arts</option>
      </select>
    </nav>
  </header>

  <main>
    <section id="bookList" class="book-grid"></section>

    <section id="addBookSection">
      <h2>Add Book</h2>
      <form id="addBookForm">
        <label for="title">Title:</label>
        <input type="text" id="title" required>

        <label for="author">Author:</label>
        <input type="text" id="author" required>

        <label for="category">Category:</label>
        <select id="category" required>
          <option value="IT">IT</option>
          <option value="Business">Business</option>
          <option value="Science">Science</option>
          <option value="Arts">Arts</option>
        </select>

        <label for="copies">Copies Available:</label>
        <input type="number" id="copies" min="0" required>

        <button type="submit">Add Book</button>
        <p id="errorMsg" class="error"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>Developed by Tiranke Ouattara | Student ID: 400622039096
</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
